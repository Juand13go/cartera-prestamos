spring.application.name=cartera-prestamos

# Base de datos: H2 en archivo, en modo PostgreSQL y con SQL estándar.
# Para pasar a PostgreSQL: agregar al pom.xml el driver de PostgreSQL y flyway-database-postgresql,
# y cambiar estas tres variables de entorno. El SQL y el código no cambian.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cartera;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_CLAVE:}

# Consola web de H2 en /h2-console (solo para desarrollo; apagada por defecto).
spring.h2.console.enabled=${H2_CONSOLA:false}

# Reglas del negocio
app.monto-minimo=${MONTO_MINIMO:50000}
app.zona-horaria=America/Bogota
# Fecha simulada para la demo, formato AAAA-MM-DD (por ejemplo 2027-01-20). Vacía = fecha real.
app.fecha-simulada=${FECHA_SIMULADA:}

# Acceso del prestamista. La contraseña se guarda solo como hash BCrypt (por defecto: cartera2026).
app.prestamista.usuario=${PRESTAMISTA_USUARIO:prestamista}
app.prestamista.clave-cifrada=${PRESTAMISTA_CLAVE_CIFRADA:$2a$10$iTIn81JU7EnO38UsKzXQ7.LcSya9bZ.duAVU3fdyOgrZA72xgFe1S}

# La sesión viaja solo en una cookie, nunca pegada a la dirección (;jsessionid=...):
# así no se filtra al copiar un enlace.
server.servlet.session.tracking-modes=cookie
