<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Nuevo préstamo')}"></head>
<body>
<header th:replace="~{fragmentos :: menu('clientes')}"></header>

<main>
    <h1>Nuevo préstamo para <a th:href="@{/clientes/{c}(c=${cliente.cedula})}" th:text="${cliente.nombre}">Laura</a></h1>
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <!-- Advertencia de cupo: solo aparece si CrearPrestamo lanzó CupoExcedidoException. -->
    <div class="aviso error" th:if="${cupo}">
        <strong>Este préstamo supera el cupo del cliente.</strong>
        Cupo: <span th:text="'$' + ${#numbers.formatInteger(cupo.cupo, 1, 'POINT')}">$5.000.000</span> ·
        ya debe: <span th:text="'$' + ${#numbers.formatInteger(cupo.deudaVigente, 1, 'POINT')}">$2.300.000</span> ·
        pide: <span th:text="'$' + ${#numbers.formatInteger(cupo.montoSolicitado, 1, 'POINT')}">$3.000.000</span>.
        Si quiere prestarlo de todas formas, marque la casilla de confirmación y vuelva a guardar.
    </div>

    <section>
        <form class="formulario" th:action="@{/prestamos}" th:object="${formulario}" method="post">
            <input type="hidden" th:field="*{cedula}">

            <fieldset>
                <legend>Dinero</legend>
                <div class="formulario">
                    <label><span>Capital</span>
                        <input type="number" th:field="*{capital}" min="1" step="1" required>
                        <small class="ayuda" th:text="'Mínimo $' + ${#numbers.formatInteger(montoMinimo, 1, 'POINT')}">Mínimo $50.000</small></label>
                    <label><span>Tasa por periodo (%)</span>
                        <input type="number" th:field="*{tasa}" min="0.01" step="0.01" required></label>
                    <label><span>Base del interés</span>
                        <select th:field="*{baseInteres}">
                            <option value="CAPITAL_INICIAL">Capital inicial (el interés nunca baja)</option>
                            <option value="CAPITAL_VIGENTE">Capital vigente (baja si abona a capital)</option>
                        </select></label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Fechas de cobro</legend>
                <div class="formulario">
                    <label><span>Fecha del desembolso</span>
                        <input type="date" th:field="*{fechaDesembolso}" required></label>
                    <label><span>Frecuencia</span>
                        <select th:field="*{frecuencia}">
                            <option value="MENSUAL">Mensual</option>
                            <option value="QUINCENAL">Quincenal (día 15 y último día del mes)</option>
                            <option value="SEMANAL">Semanal</option>
                        </select></label>
                    <label><span>Día del mes</span>
                        <input type="number" th:field="*{diaMes}" min="1" max="31">
                        <small class="ayuda">Si es mensual</small></label>
                    <label><span>Día de la semana</span>
                        <select th:field="*{diaSemana}">
                            <option value="MONDAY">Lunes</option>
                            <option value="TUESDAY">Martes</option>
                            <option value="WEDNESDAY">Miércoles</option>
                            <option value="THURSDAY">Jueves</option>
                            <option value="FRIDAY">Viernes</option>
                            <option value="SATURDAY">Sábado</option>
                            <option value="SUNDAY">Domingo</option>
                        </select>
                        <small class="ayuda">Si es semanal</small></label>
                    <label><span>Calendario</span>
                        <select th:field="*{calendario}">
                            <option value="TODOS_LOS_DIAS">Todos los días cuentan</option>
                            <option value="SIN_DOMINGOS">Sin domingos (pasa al lunes)</option>
                        </select></label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Mora</legend>
                <div class="formulario">
                    <label><span>Política de mora</span>
                        <select th:field="*{politicaMora}">
                            <option value="SIN_MULTA">Sin multa</option>
                            <option value="MULTA_FIJA_DIARIA">Multa fija diaria (pesos)</option>
                            <option value="PORCENTAJE_UNICO">Porcentaje único sobre la cuota</option>
                            <option value="PORCENTAJE_DIARIO">Porcentaje diario sobre la cuota</option>
                        </select></label>
                    <label><span>Valor de la multa</span>
                        <input type="number" th:field="*{valorMora}" min="0" step="0.01">
                        <small class="ayuda">En pesos o %, según la política</small></label>
                    <label><span>Días de gracia</span>
                        <input type="number" th:field="*{diasGracia}" min="0" step="1" required></label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pagos y cierre</legend>
                <div class="formulario">
                    <label><span>Orden de imputación</span>
                        <select th:field="*{ordenImputacion}">
                            <option value="MULTAS_PRIMERO">Multas primero, luego cuotas, luego capital</option>
                            <option value="CUOTAS_PRIMERO">Cuotas primero, luego multas, luego capital</option>
                        </select></label>
                    <label><span>Al vencer el plazo sin pagar</span>
                        <select th:field="*{alVencerPlazo}">
                            <option value="TRATAR_COMO_MORA">Tratar como mora</option>
                            <option value="SEGUIR_COBRANDO">Seguir cobrando interés</option>
                        </select>
                        <small class="ayuda">Plazo máximo: 24 meses</small></label>
                    <label><span>Interés si cancela antes</span>
                        <select th:field="*{interesCancelacion}">
                            <option value="PERIODO_COMPLETO">Periodo completo</option>
                            <option value="POR_DIAS">Por días corridos</option>
                        </select></label>
                </div>
            </fieldset>

            <label class="ancho casilla" th:if="${cupo}">
                <input type="checkbox" th:field="*{confirmaSobreCupo}">
                <span>Confirmo que quiero prestar por encima del cupo del cliente.</span>
            </label>

            <div class="acciones ancho">
                <button type="submit">Crear préstamo</button>
                <a class="boton secundario" th:href="@{/clientes/{c}(c=${cliente.cedula})}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
