<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Mis préstamos')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>

<main>
    <h1>Mis préstamos</h1>
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <p th:if="${prestamos.estaVacia()}" class="vacio">No tiene préstamos.</p>

    <section th:each="prestamo : ${prestamos}" th:with="proxima=${prestamo.proximaCuotaPendiente()}">
        <h2>
            <a th:href="@{/mis-prestamos/{id}(id=${prestamo.id})}" th:text="'Préstamo #' + ${prestamo.id}">Préstamo #1</a>
            <span th:if="${prestamo.estaCerrado()}" class="etiqueta">pagado</span>
        </h2>
        <p class="nota" th:text="'Desembolsado el ' + ${#temporals.format(prestamo.contrato.fechaDesembolso, 'dd/MM/yyyy')}
                + ' por ' + ${@textos.pesos(prestamo.contrato.capital)}">Desembolsado el 10/08/2026 por $2.000.000</p>

        <div class="progreso">
            <progress max="100" th:value="${prestamo.porcentajeDeCapitalPagado()}">0</progress>
            <span th:text="${prestamo.porcentajeDeCapitalPagado()} + ' % del capital pagado'">0 % del capital pagado</span>
        </div>

        <dl class="datos" th:unless="${prestamo.estaCerrado()}">
            <dt>Próxima fecha de cobro</dt>
            <dd th:text="${proxima != null} ? ${#temporals.format(proxima.fechaVencimiento, 'dd/MM/yyyy')} + ' (' + ${@textos.pesos(proxima.saldoPendiente())} + ')' : '—'">10/12/2026</dd>
            <dt>Para estar al día hoy</dt>
            <dd><strong th:text="${@textos.pesos(prestamo.valorParaEstarAlDia(hoy))}">$0</strong></dd>
            <dt>Capital que debe</dt><dd th:text="${@textos.pesos(prestamo.capitalAdeudado())}">$2.000.000</dd>
            <dt>Para cancelar todo hoy</dt><dd th:text="${@textos.pesos(prestamo.valorParaCancelar(hoy))}">$2.160.000</dd>
        </dl>
    </section>
</main>
</body>
</html>
