<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Entrar')}"></head>
<body class="pagina-entrar">

<main>
    <!-- Un solo formulario: el sistema deduce si es el prestamista o un cliente a partir de la cuenta. -->
    <section class="entrar">
        <h1 class="marca-grande">Libreta</h1>
        <p class="subtitulo">cartera de préstamos</p>
        <div th:replace="~{fragmentos :: mensajes}"></div>
        <p class="nota">Clientes: su cédula y su PIN. Prestamista: su usuario y su contraseña.</p>
        <form class="formulario" th:action="@{/login}" method="post">
            <label class="ancho"><span>Cédula o usuario</span>
                <input type="text" name="identificador" th:value="${identificadorEscrito}" autocomplete="username" required autofocus></label>
            <label class="ancho"><span>Contraseña</span>
                <input type="password" name="clave" autocomplete="current-password" required></label>
            <div class="ancho"><button type="submit" class="bloque">Entrar</button></div>
        </form>
        <p class="nota fecha-entrar" th:if="${fechaSimulada}"
           th:text="'Hoy (simulado): ' + ${#temporals.format(hoy, 'dd/MM/yyyy')}">Hoy (simulado): 20/01/2027</p>
    </section>
</main>
</body>
</html>
