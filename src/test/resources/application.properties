spring.application.name=cartera-prestamos

# Las pruebas usan una base H2 en memoria: se crea limpia en cada ejecución y no toca ./data.
spring.datasource.url=jdbc:h2:mem:cartera-pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.monto-minimo=50000
app.zona-horaria=America/Bogota
app.fecha-simulada=
